<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
<meta name="theme-color" content="#0b0e11">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="TounsiTrade: محاكي تعليمي للتداول في البورصة التونسية برصيد افتراضي ودروس عربية مبسّطة.">
<title>TounsiTrade — محاكي التداول التونسي</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"Segoe UI",Tahoma,system-ui,sans-serif;background:#05070a;color:#eaecef;display:flex;justify-content:center;min-height:100vh;overflow-x:hidden}
.app{width:100%;max-width:460px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:#0b0e11;position:relative;overflow-x:hidden}

/* Topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;flex-shrink:0;gap:10px;direction:ltr}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;min-width:0;justify-content:flex-end}
.logo{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 50% 35%, #e70013, #8b0010);border:1.5px solid #f0b90b;box-shadow:0 0 14px rgba(240,185,11,.25);display:grid;place-items:center;position:relative;flex-shrink:0;overflow:hidden}
.logo-emblem{font-size:22px;line-height:1}
.brand-name{font-size:17px;font-weight:900;letter-spacing:-.3px;color:#fff;text-align:right}
.brand-sub{font-size:10.5px;color:#0ecb81;margin-top:2px;display:flex;align-items:center;gap:4px;justify-content:flex-end}
.brand-sub .mini-dot{width:6px;height:6px;border-radius:50%;background:#0ecb81}
.top-actions{display:flex;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:12px;background:#161a1e;border:1px solid #262b30;color:#eaecef;font-size:17px;cursor:pointer;display:grid;place-items:center;position:relative}
.bell-badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;background:#f6465d;color:#fff;font-size:10px;font-weight:900;border-radius:9px;display:grid;place-items:center;padding:0 4px;border:2px solid #0b0e11}

/* Strip Banner */
.users-strip{display:flex;align-items:center;justify-content:center;gap:7px;margin:0 16px 10px;padding:7px 14px;border-radius:20px;background:rgba(14,203,129,.08);border:1px solid rgba(14,203,129,.25);font-size:11px;font-weight:700;color:#0ecb81;direction:rtl}
.users-strip .dot{width:6px;height:6px;border-radius:50%;background:#0ecb81;animation:pulseDot 1.4s infinite}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.3}}

/* World Clocks */
.wclk{display:flex;gap:8px;margin:0 16px 12px;direction:rtl}
.wclk .c{flex:1;background:#12161b;border:1px solid #1c222a;border-radius:12px;padding:8px 4px;text-align:center}
.wclk .n{font-size:11px;color:#8b95a5;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:3px}
.wclk .n .dot-red{width:5px;height:5px;border-radius:50%;background:#f6465d;display:inline-block}
.wclk .t{font-size:14.5px;font-weight:900;font-variant-numeric:tabular-nums;direction:ltr;color:#fff}

/* Tabs */
.tabs{display:flex;gap:5px;margin:0 16px 12px;background:#12161b;padding:5px;border-radius:14px;border:1px solid #1e242b;direction:rtl}
.tab{flex:1;text-align:center;padding:9px 2px;border-radius:11px;font-size:11px;font-weight:700;color:#7b8494;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.15s}
.tab .ticon{font-size:16px;line-height:1}
.tab.on{background:#1e252d;color:#fff;border:1px solid #28323c}

/* Content Area */
main{flex:1;padding:0 16px 28px;direction:rtl}

/* Market Status Bar */
.status-bar{background:rgba(14,203,129,.08);border:1px solid rgba(14,203,129,.25);border-radius:14px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:12px;font-weight:800}
.status-left{display:flex;align-items:center;gap:8px;direction:ltr;color:#0ecb81}
.status-right{display:flex;align-items:center;gap:6px;color:#0ecb81}
.status-btn{background:rgba(14,203,129,.18);border:none;border-radius:6px;padding:3px 9px;color:#0ecb81;font-size:10px;font-weight:800;cursor:pointer}

/* Hero Portfolio Card */
.hero-card{background:#12161b;border:1px solid #232a31;border-radius:20px;padding:18px;margin-bottom:12px;position:relative}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start}
.hero-avatar{width:42px;height:42px;border-radius:50%;background:#3b4856;border:1.5px solid #56697d;display:grid;place-items:center;font-size:19px;font-weight:900;color:#fff;position:relative}
.hero-avatar .online-badge{position:absolute;bottom:-1px;right:-1px;width:10px;height:10px;border-radius:50%;background:#0ecb81;border:1.5px solid #12161b}
.hero-balance-title{display:flex;align-items:center;gap:6px;color:#8b95a5;font-size:12px;font-weight:600;cursor:pointer}
.hero-amount{font-size:32px;font-weight:900;letter-spacing:-.5px;color:#fff;text-align:right;margin:4px 0}
.hero-amount span{font-size:16px;color:#8b95a5;margin-right:4px}
.hero-sub{font-size:11px;color:#8b95a5;text-align:right;line-height:1.6}
.hero-save{display:flex;align-items:center;justify-content:flex-end;gap:5px;font-size:10px;color:#5e6673;margin-top:4px}
.hero-save b{color:#0ecb81}
.hero-rank{color:#f0b90b;font-size:13px;font-weight:800;text-align:right;margin-top:10px}
.hero-actions{display:flex;gap:8px;margin-top:12px}
.hero-btn{flex:1;background:#1a2027;border:1px solid #28323c;border-radius:10px;padding:8px;color:#fff;font-size:12px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.hero-pills{display:flex;gap:8px;margin-top:10px}
.hero-pill{flex:1;background:#1a2027;border-radius:8px;padding:6px;text-align:center;font-size:11.5px;font-weight:700}
.hero-pill.pnl{flex:1.5;color:#0ecb81;font-weight:800}

/* Weekly Challenge Card */
.challenge-card{background:#12161b;border:1px solid #232a31;border-radius:20px;padding:16px;margin-bottom:12px}
.challenge-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.challenge-code{font-size:11px;font-weight:700;color:#5e6673}
.challenge-badge{background:rgba(240,185,11,.15);color:#f0b90b;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:6px}
.challenge-body{display:flex;align-items:center;gap:14px}
.challenge-icon-box{width:54px;height:54px;border-radius:14px;background:#e5b232;display:grid;place-items:center;font-size:28px;flex-shrink:0}
.challenge-info{flex:1;text-align:right}
.challenge-title{font-size:14.5px;font-weight:800;color:#fff}
.challenge-desc{font-size:11px;color:#8b95a5;margin-top:2px}
.challenge-bar{height:6px;background:#1e252d;border-radius:3px;overflow:hidden;margin:8px 0 6px}
.challenge-fill{height:100%;width:10%;background:#f0b90b;border-radius:3px}
.challenge-foot{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800}

/* Top 10 Header */
.top10-head{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px}
.top10-title{display:flex;align-items:center;gap:5px;font-size:14.5px;font-weight:800;color:#fff}
.top10-sub{font-size:11px;color:#8b95a5}
.top10-link{font-size:11.5px;font-weight:800;color:#f0b90b;cursor:pointer;background:none;border:none}

/* Leaderboard Rows matching screenshot */
.leaderboard-list{display:flex;flex-direction:column;gap:4px}
.lb-row{display:flex;align-items:center;justify-content:space-between;padding:11px 4px;min-height:48px;border-bottom:1px solid rgba(255,255,255,.03)}
.lb-row.me{background:rgba(240,185,11,.04);border-radius:10px}
.lb-pct{font-size:14.5px;font-weight:900;direction:ltr;font-variant-numeric:tabular-nums}
.lb-pct.up{color:#0ecb81}
.lb-pct.dn{color:#f6465d}

.lb-right{display:flex;align-items:center;gap:10px}
.lb-badge{background:#0e281e;border:1px solid #165239;color:#0ecb81;font-size:11px;font-weight:700;padding:2px 8px;border-radius:14px;display:flex;align-items:center;gap:4px}
.lb-badge .green-dot{width:6px;height:6px;border-radius:50%;background:#0ecb81}
.lb-name{font-size:14px;font-weight:600;color:#eaecef}
.lb-name.protected{color:#7b8494}
.lb-name.me{color:#fff;font-weight:800}

.lb-rank{width:24px;text-align:center;font-size:15px;font-weight:800;color:#fff}
.lb-rank.medal{font-size:18px}

.disc-footer{font-size:11px;color:#5e6673;text-align:center;margin:32px 0 20px;line-height:1.7}

/* Other tab styles */
.market-card{background:#12161b;border:1px solid #1c222a;border-radius:14px;padding:13px 15px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.chip-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:10px;scrollbar-width:none}
.chip{padding:6px 12px;border-radius:20px;background:#12161b;border:1px solid #232a31;color:#8b95a5;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.chip.on{background:rgba(240,185,11,.15);border-color:#f0b90b;color:#f0b90b}
.btn-act{padding:12px;border-radius:12px;border:none;background:#f0b90b;color:#0b0e11;font-weight:900;font-size:13px;cursor:pointer;width:100%}

/* Sheet / Modal */
.modal-backdrop{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);display:none;align-items:flex-end;justify-content:center;z-index:90}
.modal-backdrop.on{display:flex}
.modal-sheet{background:#12161b;border-top:1px solid #232a31;border-radius:24px 24px 0 0;width:100%;max-width:460px;padding:20px;max-height:85vh;overflow-y:auto;direction:rtl}
</style>
</head>
<body>

<div class="app" id="mainApp">

  <!-- Topbar -->
  <div class="topbar">
    <div class="top-actions">
      <button class="icon-btn" id="bellBtn" onclick="openNotifs()">🔔<span class="bell-badge">2</span></button>
    </div>

    <div class="brand">
      <div>
        <div class="brand-name">TounsiTrade</div>

  <!-- World Clocks Row -->
  <div class="wclk" id="worldClocks">
    <div class="c">
      <div class="n"><span class="dot-red"></span> لندن 🇬🇧</div>

    <div class="c">
      <div class="n"><span class="dot-red"></span> نيويورك 🇺🇸</div>

    <div class="c">
      <div class="n"><span class="dot-red"></span> تونس 🇹🇳</div>

  <!-- Navigation Tabs -->
  <div class="tabs">

    <div class="tab" data-tab="market" onclick="setTab('market')"><span class="ticon">📈</span>السوق</div>

    <div class="tab" data-tab="portfolio" onclick="setTab('portfolio')"><span class="ticon">💼</span>محفظتي</div>

  </div>

  <!-- Main View Container -->
  <main id="mainView"></main>

</div>

<!-- Modal Container -->
<div class="modal-backdrop" id="modalBackdrop" onclick="closeModal(event)">
  <div class="modal-sheet" id="modalSheet" onclick="event.stopPropagation()"></div>
</div>

<script>
// --- Clocks Engine ---
function updateClocks(){
  const now = new Date();
  const opts = (tz) => new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' }).format(now);
  try {
    document.getElementById('clkLondon').textContent = opts('Europe/London');
    document.getElementById('clkNY').textContent = opts('America/New_York');
    document.getElementById('clkTunis').textContent = opts('Africa/Tunis');
  } catch(e){}
}
setInterval(updateClocks, 1000);
updateClocks();

// --- Data & State ---
let currentTab = 'home';
let userCash = 10000.00;
let userHoldings = {};
let isBalanceHidden = false;

const LEADERBOARD_DATA = [
  { rank: 1, name: 'متداول محمي', medal: '🥇', pct: 13.59, badge: null, isProtected: true },
  { rank: 2, name: 'متداول محمي', medal: '🥈', pct: 3.73, badge: null, isProtected: true },

  { rank: 5, name: 'متداول محمي', medal: null, pct: 0.22, badge: null, isProtected: true },
  { rank: 6, name: 'jabeur jabeur', medal: null, pct: 0.00, badge: 'مبتدئ', isProtected: false },
  { rank: 7, name: 'Sahbi · أنت', medal: null, pct: -0.31, badge: 'مبتدئ', isMe: true, isProtected: false },
  { rank: 8, name: 'متداول محمي', medal: null, pct: -0.40, badge: null, isProtected: true },
  { rank: 9, name: 'متداول محمي', medal: null, pct: -1.05, badge: null, isProtected: true },
  { rank: 10, name: 'VIDEO BOOK', medal: null, pct: -1.63, badge: 'مبتدئ', isProtected: false }
];

const STOCKS = [
  { id: 'TN1', code: 'QRN', name: 'قرطاج للاستثمار', sector: 'بنوك', price: 92.50, chg: 1.42 },
  { id: 'TN2', code: 'MDN', name: 'مدينة الأنشطة', sector: 'مالية', price: 44.20, chg: 0.45 },
  { id: 'TN3', code: 'SFX', name: 'صفاقس للصناعة', sector: 'مالية', price: 12.85, chg: 1.18 },
  { id: 'TN4', code: 'SUS', name: 'سوسة التجارية', sector: 'نسيج', price: 12.40, chg: -1.20 },
  { id: 'TN5', code: 'BZR', name: 'بنزرت البحرية', sector: 'نسيج', price: 8.95, chg: 1.70 },
  { id: 'TN6', code: 'GBS', name: 'قابس للطاقة', sector: 'صناعة', price: 1.62, chg: -1.82 },
  { id: 'TN7', code: 'KRF', name: 'القيروان الزراعية', sector: 'أغذية', price: 6.70, chg: 2.29 },
  { id: 'TN8', code: 'MON', name: 'المنستير للأغذية', sector: 'أغذية', price: 1.95, chg: 2.63 },
  { id: 'TN9', code: 'NAB', name: 'نابل للفلاحة', sector: 'أغذية', price: 0.85, chg: -1.16 },
  { id: 'TN10', code: 'TZR', name: 'توزر للسياحة', sector: 'اتصالات', price: 55.00, chg: 1.48 }
];

const LESSONS = [
  { id: 'l1', cat: 'الأساسيات', icon: '🎯', title: 'ما هي الأسهم وكيف تربح منها؟', time: '6 د', body: 'السهم هو حصة ملكية في شركة مساهمة. تربح من الأسهم بطريقتين: نمو سعر السهم في السوق (Capital Gain)، والتوزيعات النقدية السنوية (Dividends).' },
  { id: 'l2', cat: 'الأساسيات', icon: '📈', title: 'كيف يتحرك السعر في البورصة؟', time: '7 د', body: 'السعر يتحرك بناءً على قانون العرض والطلب. إذا كان عدد المشترين الراغبين في الشراء أكبر من البائعين، يرتفع السعر، والعكس صحيح.' },
  { id: 'r1', cat: 'إدارة المخاطر', icon: '🛡️', title: 'أمر وقف الخسارة (Stop-Loss)', time: '7 د', body: 'أمر حماية يبيع تلقائياً إذا هبط السعر لمستوى معين. القاعدة الذهبية: لا تخاطر بأكثر من 1% إلى 2% من رأس مالك في صفقة واحدة.' },
  { id: 't1', cat: 'التحليل التقني', icon: '📊', title: 'مؤشر RSI وفهم التشبع', time: '7 د', body: 'مؤشر القوة النسبية RSI يقيس سرعة الحركة. فوق 70 يعني تشبع شرائي، وتحت 30 يعني تشبع بيعي.' }
];

// --- Render Navigation ---
function setTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('on', t.dataset.tab === tab);
  });
  render();
}

function render(){
  const view = document.getElementById('mainView');
  if (currentTab === 'home') renderHome(view);
  else if (currentTab === 'market') renderMarket(view);
  else if (currentTab === 'lessons') renderLessons(view);
  else if (currentTab === 'portfolio') renderPortfolio(view);
  else if (currentTab === 'more') renderMore(view);
}

// 1. الصفحة الرئيسية: تطابق لقطة الشاشة بالكامل
function renderHome(view){
  let rowsHtml = LEADERBOARD_DATA.map(item => {
    const isUp = item.pct >= 0;
    const pctStr = (isUp ? '+' : '') + item.pct.toFixed(2) + '%';
    const rankDisplay = item.medal ? `<span class="lb-rank medal">${item.medal}</span>` : `<span class="lb-rank">${item.rank}</span>`;
    const badgeHtml = item.badge ? `<span class="lb-badge"><span class="green-dot"></span>${item.badge}</span>` : '';
    const nameClass = item.isMe ? 'lb-name me' : (item.isProtected ? 'lb-name protected' : 'lb-name');

    return `
      <div class="lb-row ${item.isMe ? 'me' : ''}">
        <div class="lb-pct ${isUp ? 'up' : 'dn'}">${pctStr}</div>
        <div class="lb-right">
          ${badgeHtml}
          <div class="${nameClass}">${item.name}</div>
          ${rankDisplay}
        </div>
      </div>
    `;
  }).join('');

  view.innerHTML = `
    <!-- Market Status Bar -->
    <div class="status-bar">
      <div class="status-left">
        <button class="status-btn" onclick="setTab('market')">تبديل</button>
        <span>00:05 يفتح بعد 1ي ⏱</span>
      </div>
      <div class="status-right">
        <span>التدريب (يدوي)</span>
        <span class="mini-dot" style="width:7px;height:7px;border-radius:50%;background:#0ecb81;display:inline-block"></span>
      </div>
    </div>

    <!-- Hero Portfolio Card -->
    <div class="hero-card">
      <div class="hero-top">
        <div class="hero-avatar">
          M
          <span class="online-badge"></span>
        </div>
        <div class="hero-balance-title" onclick="toggleBalance()">
          <span>${isBalanceHidden ? '🙈' : '👁'}</span>
          <span>إجمالي قيمة المحفظة</span>
        </div>
      </div>

      <div class="hero-amount">
        <span>TND</span>
        ${isBalanceHidden ? '••••••' : '10,000.00'}
      </div>

      <div class="hero-sub">
        ${isBalanceHidden ? '💧 السيولة: •••••• · 📈 الأسهم: ••••••' : '💧 السيولة: 10,000.00 TND · 📈 الأسهم: 0.00 TND · 🔒 محجوز: 0.00 TND'}
      </div>

      <div class="hero-save">
        <span>نسخة r15-10-10</span>
        <span>·</span>
        <span>08:54 AM <b>حُفظ</b></span>
        <span>☁️</span>
      </div>

      <div class="hero-rank">
        🏆 ترتيبك في وضع التدريب: #8 من 10 متداول
      </div>

      <div class="hero-actions">
        <button class="hero-btn" onclick="setTab('portfolio')">📓 دفتر صفقاتي</button>
        <button class="hero-btn" onclick="openCalendar()">📅 التقويم 17</button>
      </div>

      <div class="hero-pills">
        <div class="hero-pill">0 مركز</div>
        <div class="hero-pill pnl">+0.00 (+0.00%)</div>
      </div>
    </div>

    <!-- Weekly Challenge Card -->
    <div class="challenge-card">
      <div class="challenge-top">
        <span class="challenge-code">W41-2026</span>
        <span class="challenge-badge">تحدي الأسبوع</span>
      </div>
      <div class="challenge-body">
        <div class="challenge-info">
          <div class="challenge-title">نوّع استثمارك</div>
          <div class="challenge-desc">امتلك أسهماً من 3 قطاعات مختلفة</div>
          <div class="challenge-bar">
            <div class="challenge-fill"></div>
          </div>

          <div style="font-size:14px">${s.price.toFixed(3)} TND</div>
          <div style="font-size:11px;color:${isUp ? '#0ecb81' : '#f6465d'}">${(isUp ? '+' : '') + s.chg.toFixed(2)}%</div>

        <div>
          <div style="font-size:14.5px;font-weight:800;color:#fff">${s.code}</div>
          <div style="font-size:11px;color:#7b8494">${s.name} · ${s.sector}</div>
        </div>
      </div>
    `;
  }).join('');

  view.innerHTML = `
    <div class="chip-row">
      <div class="chip on">الكل</div>

      <div class="chip">مالية</div>

// --- Modals (Trade, Lessons, Notifs) ---
function openTrade(stockId){
  const s = STOCKS.find(x => x.id === stockId);
  if (!s) return;
  const sheet = document.getElementById('modalSheet');
  sheet.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <button onclick="closeModal()" style="background:none;border:none;color:#8b95a5;font-size:20px;cursor:pointer">✕</button>
      <div style="font-size:16px;font-weight:900;color:#fff">${s.code} · ${s.name}</div>
    </div>
    <div style="text-align:center;font-size:24px;font-weight:900;color:#f0b90b;margin:12px 0">${s.price.toFixed(3)} TND</div>
    <div style="margin:16px 0">
      <label style="font-size:12px;color:#8b95a5;display:block;margin-bottom:6px">الكمية:</label>
      <input type="number" id="tradeQty" value="10" min="1" style="width:100%;height:44px;background:#0b0e11;border:1px solid #262b30;border-radius:10px;color:#fff;font-size:16px;text-align:center;font-weight:900">
    </div>
    <div style="display:flex;gap:8px">
      <button onclick="executeTrade('${s.id}', false)" style="flex:1;padding:12px;border:none;border-radius:10px;background:#f6465d;color:#fff;font-weight:900;cursor:pointer">بيع</button>
      <button onclick="executeTrade('${s.id}', true)" style="flex:1;padding:12px;border:none;border-radius:10px;background:#0ecb81;color:#0b0e11;font-weight:900;cursor:pointer">شراء</button>
    </div>
  `;
  document.getElementById('modalBackdrop').classList.add('on');
}

function executeTrade(stockId, isBuy){
  const s = STOCKS.find(x => x.id === stockId);
  const qty = parseInt(document.getElementById('tradeQty').value) || 10;
  const cost = s.price * qty;

  if (isBuy) {
    if (userCash < cost) { alert('السيولة غير كافية'); return; }
    userCash -= cost;
    alert(`تم شراء ${qty} سهم في ${s.code} بنجاح!`);
  } else {
    userCash += cost;
    alert(`تم بيع ${qty} سهم في ${s.code}!`);
  }
  closeModal();
  render();
}

function openLesson(id){
  const l = LESSONS.find(x => x.id === id);
  if (!l) return;
  const sheet = document.getElementById('modalSheet');
  sheet.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <button onclick="closeModal()" style="background:none;border:none;color:#8b95a5;font-size:20px;cursor:pointer">✕</button>
      <div style="font-size:15px;font-weight:900;color:#f0b90b">${l.title}</div>
    </div>
    <div style="font-size:12.5px;line-height:1.8;color:#eaecef;padding:10px 0">${l.body}</div>
    <button class="btn-act" style="margin-top:14px" onclick="closeModal()">فهمت الدرس ✓</button>
  `;
  document.getElementById('modalBackdrop').classList.add('on');
}

      <div style="font-size:11px;color:#8b95a5;margin-top:3px">تم تزويد حسابك بـ 10,000 دينار افتراضي لتجربة التداول.</div>
    </div>
    <div style="background:#0b0e11;border:1px solid #1c222a;border-radius:12px;padding:12px">

    </div>
  `;
  document.getElementById('modalBackdrop').classList.add('on');

function resetSim(){
  userCash = 10000.00;
  alert('تمت إعادة تعيين الرصيد إلى 10,000 د.ت');
  render();
}

function closeModal(){
  document.getElementById('modalBackdrop').classList.remove('on');
}
